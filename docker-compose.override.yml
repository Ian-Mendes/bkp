# Override de desenvolvimento: servidor do Vite com hot reload.
# Produção: `docker compose -f docker-compose.yml up -d --build`.
services:
  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:3000:3000"
