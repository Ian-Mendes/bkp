services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: backup
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d backup"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    volumes:
      - ./backend:/code
      - uploads:/data/uploads
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: ./backend
    command: celery -A app.worker worker --loglevel=info --concurrency=2
    env_file: .env
    volumes: ["./backend:/code"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  beat:
    build: ./backend
    command: celery -A app.worker beat --loglevel=info -s /tmp/celerybeat-schedule
    env_file: .env
    volumes: ["./backend:/code"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

volumes:
  pgdata:
  uploads:
