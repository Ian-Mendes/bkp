services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: backup
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d backup"]
      interval: 5s
      retries: 10

  # redis (removido no MVP; reativar ao reintroduzir a fila):
  #   image: redis:7
  #   # com REDIS_PASSWORD no .env (e o mesmo valor em REDIS_URL) o Redis exige senha; vazio = sem senha (dev)
  #   command: ["sh", "-c", "exec redis-server $${REDIS_PASSWORD:+--requirepass \"$$REDIS_PASSWORD\"}"]
  #   environment:
  #     REDIS_PASSWORD: ${REDIS_PASSWORD:-}

  mailpit:
    image: axllent/mailpit
    ports: ["127.0.0.1:8025:8025"]   # interface web dos e-mails capturados (SMTP em mailpit:1025)

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    volumes:
      - ./backend:/code
      - uploads:/data/uploads
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      # redis: {condition: service_started}   # reativar ao reintroduzir a fila

  # worker (removido no MVP; reativar ao reintroduzir a fila):
  #   build: ./backend
  #   command: celery -A app.worker worker --loglevel=info --concurrency=2
  #   env_file: .env
  #   volumes: ["./backend:/code"]
  #   depends_on:
  #     db: {condition: service_healthy}
  #     redis: {condition: service_started}
  #     mailpit: {condition: service_started}

  # beat (removido no MVP; reativar ao reintroduzir a fila):
  #   build: ./backend
  #   command: celery -A app.worker beat --loglevel=info -s /tmp/celerybeat-schedule
  #   env_file: .env
  #   volumes: ["./backend:/code"]
  #   depends_on:
  #     db: {condition: service_healthy}
  #     redis: {condition: service_started}

  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3000:80"]
    depends_on: [api]

volumes:
  pgdata:
  uploads:
