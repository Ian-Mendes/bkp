services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: backup
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d backup"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    command: ["sh", "-c", "exec redis-server $${REDIS_PASSWORD:+--requirepass \"$$REDIS_PASSWORD\"}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    volumes:
      - ./backend:/code
      - uploads:/data/uploads
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: ./backend
    command: celery -A app.worker worker --loglevel=info --concurrency=2
    env_file: .env
    volumes: ["./backend:/code"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
  # beat (removido no MVP; reativar ao reintroduzir a fila):
  #   build: ./backend
  #   command: celery -A app.worker beat --loglevel=info -s /tmp/celerybeat-schedule
  #   env_file: .env
  #   volumes: ["./backend:/code"]
  #   depends_on:
  #     db: {condition: service_healthy}
  #     redis: {condition: service_started}

  web:
    profiles: ["prod"]   # gateway de produção (caddy); em dev o override sobe o frontend (vite)
    build:
      context: ./frontend
    ports: ["80:80", "443:443"]
    depends_on: [api]

volumes:
  pgdata:
  uploads:
